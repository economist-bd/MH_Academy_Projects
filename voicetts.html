<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা কথা বলা ওয়েবসাইট</title>
    <style>
        body { font-family: 'SolaimanLipi', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #008CBA; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #007B9E; }
    </style>
</head>
<body>

<div class="container">
    <h2>বাংলা রিডার</h2>
    <textarea id="textInput" placeholder="এখানে বাংলায় লিখুন..."></textarea>
    <br>
    <button onclick="speakBangla()">পড়ে শোনাও 🔊</button>
</div>

<script>
    function speakBangla() {
        var text = document.getElementById("textInput").value;
        
        if (text !== "") {
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD'; // বাংলা বাংলাদেশ
            // utterance.lang = 'bn-IN'; // বাংলা ইন্ডিয়া (অপশনাল)
            
            // কথা বলার গতি ও পিচ
            utterance.rate = 1; 
            utterance.pitch = 1;

            window.speechSynthesis.cancel(); // আগের কথা থামিয়ে নতুন শুরু করবে
            window.speechSynthesis.speak(utterance);
        } else {
            alert("অনুগ্রহ করে কিছু লিখুন!");
        }
    }
</script>

</body>
</html>
